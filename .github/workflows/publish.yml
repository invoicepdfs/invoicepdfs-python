name: Publish to PyPI

# On a published release (tag vX.Y.Z), regenerate the client at that version and
# publish to PyPI as `invoicepdfs` via Trusted Publishing (OIDC — no token).
#
# One-time PyPI setup (pending publisher):
#   Project: invoicepdfs   Owner: invoicepdfs   Repo: invoicepdfs-python
#   Workflow: publish.yml   Environment: pypi
# Also needs org/repo secret SDK_SYNC_TOKEN (read invoicepdfs-openapi).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: read
  id-token: write # Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch OpenAPI spec
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/invoicepdfs/invoicepdfs-openapi/contents/openapi-3.0.json?ref=main" \
            -o openapi.json

      - name: Generate client
        run: |
          docker run --rm -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli:v7.7.0 generate \
            -i /local/openapi.json -g python -o /local/dist-src \
            --additional-properties=packageName=invoicepdfs,projectName=invoicepdfs,packageUrl=https://github.com/invoicepdfs/invoicepdfs-python,packageVersion=${{ steps.v.outputs.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist-src  # docker generates as root
          python -m pip install --upgrade build
          python -m build dist-src

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-src/dist
